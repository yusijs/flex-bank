name: Build Electron App

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: |
              apps/electron/release/*.dmg
              apps/electron/release/*.zip
          - os: windows-latest
            platform: win
            artifact: |
              apps/electron/release/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @overtime/sdk build

      - name: Build web app
        run: pnpm --filter @overtime/web build

      - name: Bundle Electron main & preload
        run: pnpm --filter @overtime/electron build:bundle

      - name: Package Electron app (Mac)
        if: matrix.platform == 'mac'
        run: pnpm --filter @overtime/electron exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package Electron app (Windows)
        if: matrix.platform == 'win'
        run: pnpm --filter @overtime/electron exec electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Overtime-Tracker-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
